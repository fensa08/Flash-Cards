name: CI

on:
  push:
    branches: [main]
  pull_request:

defaults:
  run:
    working-directory: flash-cards-app

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: flash-cards-app/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:integration
      - run: npx firebase emulators:exec --only firestore "npm run build"
        env:
          FIREBASE_ADMIN_PROJECT_ID: flash-cards-app-ci
          SITE_PASSWORD: ci-build-password
      - run: npm run test:e2e
        env:
          CI: true
